# Every yadgarhq repo carries pre-commit (D59). Hook failure is signal, not
# obstacle: fix the cause and re-stage. Never --no-verify.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        # Helm templates are Go templates that HAPPEN to look like YAML —
        # `{{- toYaml ... }}` is a syntax error to any real parser. Excluding
        # them is not lowering the bar: `helm lint` and `helm template` are the
        # checks that actually apply, and they run in CI.
        exclude: ^chart/templates/
      - id: check-toml

  # Shared, from yadgarhq/actions (D62). IMMUTABLE rev: pre-commit caches a rev
  # at first install and never re-resolves it, so a moving tag would silently
  # freeze each machine at whatever it meant the day it first ran.
  - repo: https://github.com/yadgarhq/actions
    rev: v1.20.0
    hooks:
      - id: gitleaks
      - id: prettier
        exclude: ^(chart/templates/|proto/)
      - id: hadolint
      # A CONSUMER IS NOT LINTED UNTIL IT REFERENCES THE HOOK, which is why this
      # line exists rather than being inherited. `ci-pr.yaml` installs the
      # `actionlint` binary unconditionally and `yadgarhq/actions` publishes the
      # hook, but publication makes a check AVAILABLE rather than switching it
      # on — for fifteen of sixteen repositories that install was a no-op
      # (ledger 620). A repository with a `.github/workflows/` and no such line
      # is one whose workflows nothing reads.
      #
      # `actionlint` must be on PATH locally as well as in CI. That is the point
      # rather than a nuisance: a check that runs in CI and not on a laptop is
      # two definitions of clean.
      #
      # AND THE HOOK NOW REFUSES A THIRD STATE. At v1.12.0 this entry was a bare
      # `language: system` call on the binary, and actionlint SILENTLY DISABLES
      # its whole shellcheck rule class when shellcheck is absent — so on a
      # machine without it this line reported `Passed` having linted every
      # `run:` block with nothing. v1.12.2 replaced the entry with
      # `hooks/actionlint.sh`, which feeds a stub whose only defect is SC2086
      # and refuses unless SC2086 comes back (ledger 636). This repository was
      # the only one in the estate still running the unguarded form.
      - id: actionlint
      - id: cargo-fmt
      - id: cargo-clippy
      - id: cargo-deny
      - id: observe-coverage
      - id: helm-lint
      # ADR-0569'S GATE, AND THE REASON THIS REPOSITORY IS ONLY NOW RUNNING IT.
      # The gate was a shell script copied byte-identically into five
      # repositories — gateway, iam, iam-db, task and task-db — each declaring it
      # `repo: local`. `project-db` never carried a copy, so it kept `fn env_or`
      # and eleven compiled-in defaults while the rule was "enforced estate-wide"
      # (ledger 626 closed on that claim; ledger 715 is it being false). Five
      # copies checked the five repositories that already passed.
      #
      # `yadgarhq/actions` v1.15.0 publishes it (actions#59), and ADR-0577 says a
      # published gate is closed only when every consumer references it — which is
      # what this line is. The rev moves from v1.13.1 to v1.15.0 for the whole
      # block because pre-commit resolves one rev per repository entry.
      - id: no-compiled-in-defaults
      # LEDGER 734, adopting ledger 726's gate: a file read at boot is marked
      # ADR-0523-WATCHED naming a src/rotate.rs material, or ADR-0523-UNWATCHED
      # with a reason. This repository had never run it before this PR.
      # LEDGER 658. A mechanical ceiling on the size of a `run:` block. Adopted
      # for CLASS UNIFORMITY rather than for a violation here: measured
      # 2026-09-09 this repository's workflows hold no block scalar at all,
      # exactly like the nine other consumers that already carry the id. A
      # consumer's workflow is a caller. The gate arms the day someone writes
      # the first real block, which is the point of listing it before then.
      - id: run-block-size
      - id: boot-reads-watched
      # LEDGER 719. Two ceilings, and they measure different things. `complexity`
      # is the line count — 500 per file, 120 per function — which catches a flat
      # file that grew rather than a tangled one. `cargo-clippy-complexity` is
      # clippy's `cognitive_complexity` and `too_many_arguments`, which catch the
      # nesting a line count cannot see. Neither is a substitute for the other,
      # which is why both ids are here rather than one.
      #
      # ADOPTED ONLY NOW BECAUSE THIS REPOSITORY DID NOT PASS. `src/boot.rs` was
      # 851 lines, `src/write.rs` 694, `fn main` 186 and `read::resolve` 126.
      # Referencing the gate before the refactor would have meant an exemption
      # list, which is how a ceiling stops meaning anything (`complexity.py` says
      # so in as many words). The refactor came first; these two lines are what
      # make it hold.
      #
      # THE REV MOVES FROM v1.18.2 TO v1.18.3 FOR THIS ID, and the whole block
      # comes with it because pre-commit resolves one rev per repository entry.
      # v1.18.2's `complexity.py` PREDATES actions#69: it has no
      # `TEST_FILE_NAMES`, no `TEST_ATTR` and no `_is_test_fn`, and exempts a
      # test DIRECTORY only — so it measures the newly-created
      # `src/boot/tests.rs` as production code. That file passes at 419 lines
      # today, which is the trap rather than the reassurance: the next unit test
      # added to it counts against a PRODUCTION ceiling, and the refusal would
      # name a line count nobody could act on. `git diff --stat v1.18.2 v1.18.3`
      # is `hooks/complexity.py` and its test file and nothing else, so no other
      # hook in this block changes behaviour.
      - id: complexity
      - id: cargo-clippy-complexity
      # LEDGER 837. `hooks/no_test_skips.py` refuses a test that stops
      # running — a skip marker, an unsatisfiable cfg, an environment-probe
      # guard at the first statement, a narrowed `cargo test`/pytest
      # invocation, or a captured run whose exit code is suppressed.
      # ADR-0577: a published hook nobody references gates nothing, and this
      # one gates this repository for the first time with this line.
      #
      # THE REV ALSO CARRIES v1.19.0's `observe-coverage` Rule B tightening
      # (resolving callees and route handlers crate-wide rather than
      # file-local); it changes nothing this repository's own
      # `observe-coverage` hook enforces. See the PR body for the
      # measurement.
      - id: no-test-skips
