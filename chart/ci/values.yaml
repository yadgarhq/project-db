# WHAT THIS CHART'S OWN CI RENDERS AGAINST, bare — no parent, no subchart.
#
# ADR-0845 (ledger 1278, C-DB1) drops `tls.enabled`'s chart default and makes
# it `required` (`chart/values.schema.json`), so a bare `helm lint --strict
# chart` and a bare `helm template` both refuse the moment that lands, with
# nothing in THIS repository's own diff to explain why: the shared
# `helm-lint` hook (`yadgarhq/actions` C-A2) and `scripts/tests/*.py` render
# this chart alone, with no parent values to fall back on.
#
# `yadgarhq/actions`'s `chart_values_override.py` passes this file with `-f`
# to both `helm lint --strict` and `helm template` whenever it exists — the
# same backward-compatible convention `chart/ci/api-versions.txt` uses for
# `--api-versions`. A chart with no such file sees no difference; this one
# now needs it, the same reason `yadgarhq/chart`'s own `chart/ci/values.yaml`
# exists at the PARENT level (ruling 11).
#
# `scripts/tests/test_values_schema.py` and `scripts/tests/test_render_checks.py`
# pass this same file to every bare `helm template`/`helm lint` they run, so
# the suite and the hook measure one chart rather than two.
tls:
  enabled: true
