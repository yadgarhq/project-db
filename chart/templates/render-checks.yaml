{{/*
EVERY RENDER CHECK THIS CHART DECLARES, IN ONE FILE, AND THE FILE RENDERS NOTHING.

ONE CHECK PER OPERATOR, NOT ONE PER KIND. Each toggle below renders one kind today,
so the two counts happen to be equal here — they are not the same rule, and the
number this chart asserts is the number of CHECKS.
`scripts/tests/test_render_checks.py` counts the checks DECLARED here and asserts
that number, so a check deleted from this file reddens the suite on the count rather
than letting it quietly exercise one fewer.

EACH CHECK SITS BEHIND ITS OWN TOGGLE, AND THE TOGGLES ARE NOT OR-ED TOGETHER. An
adopter who creates the database and does not autoscale is refused for
mariadb-operator alone, and never for KEDA. `yadgarhq/platform` OR-s three toggles
into one check because all three render objects from the SAME group; these two
render objects from two groups that two different operators provide, so they are two
checks.

THE FILENAME DOES NOT BEGIN WITH AN UNDERSCORE, AND THAT IS LOAD-BEARING. helm
treats `templates/_*` as partials and never renders them, so a `fail` that lived
only in `_require_api.tpl` would never fire. The definition is a partial; the CALL
has to sit in a rendered template. Do not tidy the two into one file.

THE GROUP IS THE OPERATOR'S OWN, and here that needs no argument the way Envoy
Gateway's did in `yadgarhq/platform`: `k8s.mariadb.com/v1alpha1` is registered by
mariadb-operator and by nothing else, so there is no sibling specification a check
could name by mistake. The string is a LITERAL here because
`scripts/tests/test_render_checks.py` reads these arguments off the template to
count and exercise the checks; it is RECORDED a second time in `values.yaml` under
`database.mariadbOperator.apiVersion`, beside the toggle, and the gate that keeps
the two one is
`test_mariadb.py::test_the_render_check_names_the_group_the_values_file_records`.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all. A render check
may only ever sit behind a default-false toggle: `Has` is false for every CRD-backed
group with no cluster, so a check reachable at the defaults would refuse every
offline render in the estate.
*/}}
{{/*
THE SHAPE OF `database.create`, REFUSED BEFORE ANY TOGGLE READS IT.

DECLARED FIRST IN THIS FILE, AND THAT IS THE POINT. Everything below this block, and
`templates/mariadb.yaml` beside it, gates on `{{ if .Values.database.create }}` — a
BARE TRUTHINESS TEST, which is FAIL-OPEN on a string. Measured on helm 3.20.2 and
4.3.0, identically, over ten writable shapes:

  false, 0, null, {}, []   render no MariaDB
  true                     renders one
  "false", "no", "true", 1 render one

So `database.create: "false"` — which reads as OFF to any human, and is what a
`--set-string`, a templated overlay or a quoted values file produces — CREATES A
DATABASE ENGINE. `{}` additionally draws a coalesce warning on both helm lines and
still resolves falsy, so the two shapes an adopter is most likely to write are the
two that say least about what they did.

ADR-0797 IS THE GOVERNING RULE: a values key a helm condition reads, and that some
chart in the tree DECLARES, is validated with `kindIs "bool"` ON THE RAW VALUE. Not
`hasKey` alone — `{}` is present and is not a toggle. Not `kindIs "map"` — that is
ADR-0794's rule for a key whose value is a BLOCK, and this one's value is a bool.
Never on the result of a `default`: sprig's `default` substitutes on an EMPTY value,
so `false`, `0`, `""` and `[]` all collapse into the default and the kind test then
covers exactly the non-empty scalars.

`hasKey` COMES FIRST BECAUSE `kindOf` CANNOT TELL A DELETED KEY FROM AN ABSENT ONE —
it answers `invalid` for both. The distinction is load-bearing here, and it is
MEASURED rather than assumed: helm DELETES a null-valued key when some chart in the
tree declares it, and restores no default. This chart's own `values.yaml` declares
`database.create: false`, so a values file that OMITS the key gets that default back
and `hasKey` is true. `hasKey` is false only when a values file wrote `create:` with
NO VALUE and helm deleted it — the one shape where the chart's default does not
apply and nothing warns. THAT is why an absent key REFUSES here rather than
defaulting false: the absence is not an adopter leaving the key alone, it is an
adopter having written something helm threw away.

THE REFUSAL TEXT MAY NOT QUOTE THE RAISE TEXT IT REPLACES (ADR-0794). A refusal and
a raise both exit 1, so the only thing that tells them apart is the message — and a
refusal that quotes one of go/template's own error markers makes an assertion of the
form "the raise marker is not in this message" false-green for ever.
`scripts/tests/test_render_checks.py::test_the_shape_refusal_does_not_quote_a_raise`
holds the banned markers, in one place, and reads this whole file for them; the
eleven-shape table beside it is the gate on this block.
*/}}
{{- if not (hasKey .Values "database") }}
{{- fail (join "" (list
      "project-db: `database` is absent from the values, so `database.create` cannot be read. "
      "Helm deletes a null-valued key that a chart in the tree declares, and restores no "
      "default, so a values file writing `database:` with no value leaves this chart with "
      "nothing under it. Write the keys you mean, or omit `database` entirely and this "
      "chart's own defaults apply.")) }}
{{- end }}
{{- if not (hasKey .Values.database "create") }}
{{- fail (join "" (list
      "project-db: `database.create` is absent. This chart's `values.yaml` declares it false, so "
      "it is missing only when a values file wrote `create:` with NO VALUE — helm deletes a "
      "null-valued key a chart declares and restores no default. Write `database.create: "
      "false` to leave the MariaDB instance uncreated, or `true` to create it.")) }}
{{- end }}
{{- if not (kindIs "bool" .Values.database.create) }}
{{- fail (printf (join "" (list
      "project-db: `database.create` must be true or false and is %s (%s). A string, number, map "
      "or list here is not a toggle: the template gates on bare truthiness, so \"false\", "
      "\"no\", \"true\" and 1 all CREATE a MariaDB instance while {}, 0 and [] do not, and "
      "nothing tells you which one you wrote. Write the bare word `true` or `false`."))
      (kindOf .Values.database.create) (toJson .Values.database.create)) }}
{{- end }}
{{- if .Values.database.create }}
{{- include "project-db.require-api" (dict
      "context" $
      "apiVersion" "k8s.mariadb.com/v1alpha1"
      "operator" "mariadb-operator"
      "toggle" "database.create") }}
{{- end }}

{{/*
THE SHAPE OF `autoscaling.enabled`, REFUSED BEFORE THE TOGGLE IS READ (ADR-0850
widens ADR-0797 past a helm dependency `condition:` to any template-read toggle).

`templates/scaledobject.yaml` and the KEDA check below both gate on
`{{ if .Values.autoscaling.enabled }}` — bare truthiness, fail-open on a string
exactly as `database.create` was. ADR-0797's rule applies unchanged: `kindIs "bool"`
on the raw value, `hasKey` first because `kindOf` cannot tell a deleted key from an
absent one.

ONE LEVEL HIGHER THAN `database.create` NEEDS, AND THAT IS THE DIFFERENCE FROM IT.
`database` is never itself the condition — only `.create` under it is — so that
block never has to ask whether `database` is a map before calling `hasKey` on it.
`autoscaling` IS written by an adopter sometimes, measured here: `autoscaling: x`
(a bare scalar, not a mapping) passes helm's coalescing unchanged — the override
wins outright, with no warning — and then `hasKey .Values.autoscaling "enabled"`
would be handed a string rather than a map. Sprig's `hasKey` requires a
`map[string]interface{}` argument, so that call does not fail open or closed, it
RAISES, which is the same class of defect as the bare truthiness test just one level
up. `kindIs "map"` on `autoscaling` is NEVER unsafe to call — unlike `hasKey` it
classifies any value without erroring — so it runs as its OWN independent block,
second, and `fail` aborts the whole render before the third block's `hasKey` is ever
reached for a shape the second block already refused. The four blocks below stay
INDEPENDENT `{{ if }}...{{ end }}` pairs for exactly that reason, never `else if`:
`scripts/tests/test_render_checks.py`'s mutation case strips one arm at a time by
finding its own opening and closing tags, which an `else if` chain sharing one
closing tag cannot be decomposed into.

MEASURED, THE SAME SHAPE CRASHES `templates/scaledobject.yaml` FIRST. On helm 4.3.0,
`autoscaling: x` against this chart named `scaledobject.yaml:1:14` with a raw
two-level dot-chain template error — before this file's checks run at all.
`templates/scaledobject.yaml` carries its own `kindIs "map"` guard for exactly that
reason: the refusal below is the message an adopter sees only once the FIRST reader
stops crashing ahead of it.

THE REFUSAL TEXT MAY NOT QUOTE THE RAISE TEXT IT REPLACES (ADR-0794), same rule as
`database.create`'s block; `scripts/tests/test_render_checks.py` holds the banned
markers and reads this whole file for them.
*/}}
{{- if not (hasKey .Values "autoscaling") }}
{{- fail (join "" (list
      "project-db: `autoscaling` is absent from the values, so `autoscaling.enabled` cannot be read. "
      "Helm deletes a null-valued key that a chart in the tree declares, and restores no "
      "default, so a values file writing `autoscaling:` with no value leaves this chart with "
      "nothing under it. Write the keys you mean, or omit `autoscaling` entirely and this "
      "chart's own defaults apply.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.autoscaling) }}
{{- fail (printf (join "" (list
      "project-db: `autoscaling` must be a map and is %s (%s). `autoscaling.enabled` is read "
      "from inside it. Write `autoscaling:` as a block, with `enabled: true` or "
      "`enabled: false` inside it."))
      (kindOf .Values.autoscaling) (toJson .Values.autoscaling)) }}
{{- end }}
{{- if not (hasKey .Values.autoscaling "enabled") }}
{{- fail (join "" (list
      "project-db: `autoscaling.enabled` is absent. This chart's `values.yaml` declares it false, "
      "so it is missing only when a values file wrote `enabled:` with NO VALUE — helm deletes a "
      "null-valued key a chart declares and restores no default. Write `autoscaling.enabled: "
      "false` to leave autoscaling off, or `true` to turn it on.")) }}
{{- end }}
{{- if not (kindIs "bool" (index .Values.autoscaling "enabled")) }}
{{- fail (printf (join "" (list
      "project-db: `autoscaling.enabled` must be true or false and is %s (%s). A string, number, "
      "map or list here is not a toggle: the template gates on bare truthiness, so \"false\", "
      "\"no\", \"true\" and 1 all RENDER a ScaledObject while {}, 0 and [] do not, and nothing "
      "tells you which one you wrote. Write the bare word `true` or `false`."))
      (kindOf (index .Values.autoscaling "enabled")) (toJson (index .Values.autoscaling "enabled"))) }}
{{- end }}

{{/*
KEDA, BEHIND THE TOGGLE THAT RENDERS THE ScaledObject.

`autoscaling.enabled` renders `templates/scaledobject.yaml`, whose one kind is
`keda.sh/v1alpha1/ScaledObject`. Without this check an adopter who turns autoscaling
on against a cluster with no KEDA renders cleanly and then fails at apply with `no
matches for kind ScaledObject`, half-way through an install — the pod and the Service
applied, the autoscaler absent, and the message naming a kind rather than the
operator to install.

THE GROUP IS THE OPERATOR'S OWN. `keda.sh/v1alpha1` is registered by KEDA and by
nothing else, so there is no sibling specification this could name by mistake — the
argument `yadgarhq/platform`'s Envoy Gateway check has to make, and which does not
arise here. `ScaledObject` is the only kind of that group this chart renders; KEDA
serves five more, and a chart that later renders one of them is covered by this same
check, because the rule is one check per OPERATOR.

NO GATEWAY API CHECK IS ADDED BESIDE IT, and that is a decision rather than an
omission. This chart renders no Gateway API object at all, and the estate's
`gateway.enabled` is the one toggle that defaults TRUE — a render check behind a
default-true toggle refuses every offline render in the estate, which is the exact
failure the opt-in rule below exists to prevent.

THE STRING IS A LITERAL HERE AND IS RECORDED IN `values.yaml` UNDER
`autoscaling.kedaOperator.apiVersion`, read off KEDA as the estate pins it. It has to
be a literal because `scripts/tests/test_render_checks.py` reads these arguments off
the template to count and exercise the checks; the gate that keeps the two one is
`test_every_declared_check_names_the_group_the_values_file_records`.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all. `autoscaling.enabled`
defaults false, for the same reason `database.create` does.
*/}}
{{- if .Values.autoscaling.enabled }}
{{- include "project-db.require-api" (dict
      "context" $
      "apiVersion" "keda.sh/v1alpha1"
      "operator" "KEDA"
      "toggle" "autoscaling.enabled") }}
{{- end }}

{{/*
ADR-0845's K-1 GUARD: `tls.enabled` RENDERS `LISTEN_TLS_ENABLED` UNCONDITIONALLY
(ledger 1278, C-DB1). `templates/deployment.yaml` used to gate that env on
`{{- if .Values.tls.enabled }}` — bare truthiness, which rendered no variable
at all for null or absence — and now renders
`{{ ternary "1" "0" .Values.tls.enabled | quote }}` unconditionally instead.
`ternary` on a non-bool is a Go type error naming no key at all (measured on
helm 4.3.0; re-measured on 3.18.4 — same shape), so the guard below has to run
BEFORE that expression does, in the SAME file this chart already keeps every
shape refusal in.

THE SCHEMA PRE-EMPTS THE ABSENT CASE (`tls.required: [enabled]` plus
`tls.enabled.type: boolean`) and K-1 accepts that: `required` alone passes a
null value, which is exactly what `tls: {enabled: null}` and `tls: null` are
— Helm deletes a null-valued key that a chart in the tree declares and
restores no default, so `enabled` or the whole `tls` block reaches THIS guard
as ABSENT rather than failing the schema. `tls: {enabled: "true"}` is a third
shape the schema's `type: boolean` already refuses on its own (a quoted
string is not the JSON boolean the schema asks for) — kept here as a render
case too only because K-1 names it explicitly; the schema is what actually
stops it reaching `ternary`.

ONE SENTENCE, NOT PER-ARM, because K-1 states the guard this way and the three
non-absent shapes (`tls` non-map, `enabled` absent, `enabled` non-bool) all
mean the same thing to an operator: the leaf is not a bare `true`/`false`.
The sentence names BOTH the chart key and the variable it renders, which is
ADR-0845's own rule for a binary refusal, carried into the chart's.
*/}}
{{- if not (and (kindIs "map" .Values.tls) (hasKey .Values.tls "enabled") (kindIs "bool" .Values.tls.enabled)) }}
{{- fail "project-db: tls.enabled must be set to true or false; it renders LISTEN_TLS_ENABLED (ADR-0845, ADR-0797)" }}
{{- end }}

{{/*
B-U5E, FOLDED INTO C-DB1 (K-8 STEP 1, K-3): THE EXPAND HALF OF
`tls.clientAuth`. The schema declares `tls.clientAuth`, `tls.clientCaSecret`
and `tls.clientCaSecretKey` (this PR); `templates/deployment.yaml` renders
`LISTEN_TLS_CLIENT_AUTH`, `LISTEN_TLS_CLIENT_CA_FILE` and the `ca.crt` item
only when `tls.clientAuth` is PRESENT; the binary reads none of it yet — B-U5
is the contract that adopts `yadgar_lifecycle::serve_tls` and enforces the
mode.

VALIDATED ONLY WHEN PRESENT, deliberately asymmetric with the `tls.enabled`
guard above: an ABSENT `tls.clientAuth` must render exactly as origin/main
(render-neutral is the whole of what an expand promises, K-8), so this block
does nothing at all until a values file writes the key.

`off` IS THE ONLY VALUE THIS CHART VERSION ACCEPTS, once written. `optional`
and `required` are real values B-U5's contract will serve, and refusing them
HERE — rather than silently rendering them — is what keeps a values file from
looking enforced during the window the binary does not read it (K-8's own
phrase). The sentence names the unit that lifts the refusal, so an operator
who hits it mid-rollout knows it is not a defect.
*/}}
{{- if and (kindIs "map" .Values.tls) (hasKey .Values.tls "clientAuth") }}
{{- if not (kindIs "string" .Values.tls.clientAuth) }}
{{- fail (printf (join "" (list
      "project-db: tls.clientAuth must be a quoted string (\"off\", \"optional\" or "
      "\"required\") and is %s (%s). YAML reads a bare off as false: write "
      "clientAuth: \"off\"."))
      (kindOf .Values.tls.clientAuth) (toJson .Values.tls.clientAuth)) }}
{{- end }}
{{- if not (has .Values.tls.clientAuth (list "off" "optional" "required")) }}
{{- fail (printf "project-db: tls.clientAuth is %q; it must be off, optional or required." .Values.tls.clientAuth) }}
{{- end }}
{{- if ne .Values.tls.clientAuth "off" }}
{{- fail (printf (join "" (list
      "project-db: tls.clientAuth is %q; this chart version renders the key but the binary "
      "does not enforce mutual TLS yet (ledger 1278, B-U5 lands the contract). Write "
      "tls.clientAuth: \"off\" (quoted — YAML reads a bare off as false), or omit the key, "
      "until then."))
      .Values.tls.clientAuth) }}
{{- end }}
{{- end }}
